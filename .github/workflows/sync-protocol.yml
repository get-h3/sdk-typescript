name: Sync Protocol

on:
  # GAP-073: an SDK source change must exercise the cross-language round-trip,
  # not only a protocol dispatch. Before this, a wire-format-breaking change to
  # src/ shipped with every workflow green and zero round-trip runs. Paths are
  # scoped to the files that can change the SDK's wire behaviour (src/ includes
  # the generated src/protocol.ts); board/.vfs/.gitreins bookkeeping and prose
  # docs are excluded, so a foreman bookkeeping commit cannot fire it.
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/sync-protocol.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/sync-protocol.yml"
  repository_dispatch:
    types: [schema-updated]
  workflow_dispatch:
    # H3-GAP-096: a plain manual dispatch is a DIAGNOSTIC — it must run schema
    # alignment and never publish npm or push a version/tag commit. Publishing
    # requires flipping this explicit input.
    inputs:
      release:
        description: "Run the release job (regenerate, commit, tag, publish to npm)"
        type: boolean
        default: false

jobs:
  check-schema-alignment:
    # GAP-073: this job regenerates src/protocol.ts from get-h3/protocol@main
    # and FAILS when the generated output differs from the committed file. That
    # is a protocol-sync precondition, not an SDK-source check: on a push or PR
    # it both duplicates ci.yml and turns any upstream protocol drift into a
    # failure that skips the round-trip job it `needs:` — the exact hole this
    # task closes. Keep it pinned to the events it was written for; the
    # round-trip job runs for every event. (The `release` job already gates on
    # workflow_dispatch, so its `needs:` is unaffected.)
    if: ${{ github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: get-h3/protocol
          path: .protocol-src

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - name: Regenerate schemas from protocol JSON Schema
        run: |
          npx tsx scripts/generate-schemas.ts --protocol-dir .protocol-src/schemas/v1
          npx prettier --write src/protocol.ts

      - name: Check TypeScript compilation
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Verify schema alignment (diff check)
        run: |
          if ! git diff --exit-code --quiet src/protocol.ts; then
            echo "⚠️  Protocol schemas have changed!"
            echo ""
            echo "Generated output differs from src/protocol.ts"
            echo ""
            echo "Action required:"
            echo "  1. Review the diff: git diff src/protocol.ts"
            echo "  2. Update tests if needed"
            echo "  3. Commit the regenerated protocol.ts"
            echo "  4. Bump version: npm version patch"
            echo "  5. Publish: npm publish"
            echo ""
            echo "Run locally to preview:"
            echo "  npm run generate"
            echo "  git diff src/protocol.ts"
            exit 1
          fi
          echo "✅ src/protocol.ts is up-to-date with protocol schemas"

  # Release workflow (manual trigger, and only with the explicit `release`
  # input — a plain diagnostic dispatch stops at schema alignment)
  release:
    needs: check-schema-alignment
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: get-h3/protocol
          path: .protocol-src

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - name: Regenerate schemas
        run: |
          npx tsx scripts/generate-schemas.ts --protocol-dir .protocol-src/schemas/v1
          npx prettier --write src/protocol.ts

      - name: Verify tests pass
        run: npx vitest run

      - name: Commit regenerated schemas
        run: |
          git config user.name "h3-bot"
          git config user.email "bot@get-h3.dev"
          git add src/protocol.ts
          git rm -f .schemas-changed || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate Zod schemas from protocol JSON Schema"
            git push
          fi

      - name: Bump version and tag
        run: |
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json
          git commit -m "release: v${VERSION} — protocol schema sync"
          git tag "v${VERSION}"
          git push --tags

      - name: Publish to npm
        run: |
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  roundtrip:
    # GAP-073: unchanged for repository_dispatch/workflow_dispatch — a failed
    # schema-alignment check still blocks the round-trip — but a SKIPPED
    # check-schema-alignment (the push/pull_request path) must not.
    needs: check-schema-alignment
    if: ${{ !cancelled() && (needs.check-schema-alignment.result == 'success' || needs.check-schema-alignment.result == 'skipped') }}
    uses: get-h3/h3/.github/workflows/roundtrip.yml@main
