name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          path: sdk-typescript
      - uses: actions/checkout@v4
        with:
          repository: get-h3/protocol
          path: protocol
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: sdk-typescript/package-lock.json
      - run: npm ci
        working-directory: sdk-typescript
      # H3-GAP-087 — this repo polices its own count prose: canonical counts
      # (scripts/test-count.txt) → the suite count derived from the files
      # vitest.config.ts includes (`src/**/*.test.ts`) → battery parity against
      # the checked-out shim → stale-literal sweep with explicit historical
      # exemptions. Exit 1 (drift) / 2 (misconfigured) fail.
      - name: Compliance-test count guard
        run: sh scripts/check-test-count.sh
        working-directory: sdk-typescript
      - run: npx tsc --noEmit
        working-directory: sdk-typescript
      - run: npm run build
        working-directory: sdk-typescript
      - run: node -e "import('./dist/index.js').then(m => { if (!m.createH3Router || !m.SDK_VERSION) process.exit(1); console.log('dist import OK', m.SDK_VERSION) })"
        working-directory: sdk-typescript
      - run: npx vitest run
        working-directory: sdk-typescript
      # QA-6 — a fresh clone must pass its own suite. The schema-validation file
      # resolves the sibling ../protocol/schemas/v1, which the checkout above
      # supplies on purpose, so CI structurally could not catch a failure that
      # only happens without it: `git clone && npm ci && npx vitest run` died on
      # "Schema file not found". This gate hides the sibling, runs the suite, and
      # demands exit 0 PLUS the named self-skip message, then restores the
      # checkout. It fails if the skip guard is removed (the suite then dies on
      # the missing schemas) and if the message stops naming the clone command.
      - name: Suite passes without the sibling protocol checkout (fresh-clone gate)
        working-directory: sdk-typescript
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/vitest-no-protocol-checkout.log"
          mv ../protocol ../protocol-hidden
          restore() { mv ../protocol-hidden ../protocol; }
          trap restore EXIT
          status=0
          npx vitest run >"$LOG" 2>&1 || status=$?
          restore
          trap - EXIT
          echo "--- npx vitest run with ../protocol hidden (exit $status) ---"
          cat "$LOG"
          if [ "$status" -ne 0 ]; then
            echo "FAIL: the suite must pass without the sibling protocol checkout; it exited $status." >&2
            exit 1
          fi
          if ! grep -qF "[schema-validation] SELF-SKIP" "$LOG"; then
            echo "FAIL: the schema-validation suite did not announce its self-skip." >&2
            echo "      Expected the named message from src/__tests__/schema-validation.test.ts." >&2
            exit 1
          fi
          if ! grep -qF "git clone https://github.com/get-h3/protocol ../protocol" "$LOG"; then
            echo "FAIL: the self-skip message does not name the command that obtains the schemas." >&2
            exit 1
          fi
          echo "OK: fresh-clone suite is green and schema-validation announced its self-skip."

  e2e-battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: sdk-typescript
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: sdk-typescript/package-lock.json
      - run: npm ci
        working-directory: sdk-typescript
      - run: npm run build
        working-directory: sdk-typescript
      - name: Run h3-test battery against echo harness (:9191)
        working-directory: sdk-typescript
        run: |
          set -euo pipefail
          npx tsx src/examples/echo.ts &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            pkill -P "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          # Wait for readiness (max ~30s); /v1/health is the router's health route
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9191/v1/health >/dev/null 2>&1; then
              echo "echo harness ready after ${i} probes (0.5s each)"
              break
            fi
            sleep 0.5
          done
          if ! curl -fsS http://localhost:9191/v1/health >/dev/null 2>&1; then
            echo "echo harness failed to become ready on :9191" >&2
            exit 1
          fi
          # venv avoids PEP 668 externally-managed-environment on ubuntu-latest
          python3 -m venv /tmp/h3-shim-venv
          # hermes-h3-shim not yet on PyPI (404 as of 2026-08-07) — install from
          # the shim repo at a pinned SHA; deliberately refresh the SHA when updating.
          # Switch to `pip install hermes-h3-shim` once published.
          /tmp/h3-shim-venv/bin/pip install --quiet "git+https://github.com/get-h3/shim.git@f8cc076433e0976234ea7b3012a09aec89560246"
          /tmp/h3-shim-venv/bin/h3-test --endpoint http://localhost:9191
