name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          path: sdk-typescript
      - uses: actions/checkout@v4
        with:
          repository: get-h3/protocol
          path: protocol
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: sdk-typescript/package-lock.json
      - run: npm ci
        working-directory: sdk-typescript
      - run: npx tsc --noEmit
        working-directory: sdk-typescript
      - run: npm run build
        working-directory: sdk-typescript
      - run: node -e "import('./dist/index.js').then(m => { if (!m.createH3Router || !m.SDK_VERSION) process.exit(1); console.log('dist import OK', m.SDK_VERSION) })"
        working-directory: sdk-typescript
      - run: npx vitest run
        working-directory: sdk-typescript
